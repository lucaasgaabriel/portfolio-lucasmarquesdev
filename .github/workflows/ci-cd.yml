name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, audit & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare binding types
        run: pnpm cf-typegen

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm run typecheck

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build

  secrets-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  dast:
    name: DAST (OWASP ZAP baseline)
    needs: [quality, secrets-scan, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare binding types
        run: pnpm cf-typegen

      - name: Build Worker bundle
        run: pnpm exec opennextjs-cloudflare build

      - name: Start local preview
        run: |
          nohup pnpm exec wrangler dev --port 8788 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8788/ >/dev/null && exit 0
            sleep 1
          done
          echo "Worker never came up:"; cat wrangler-dev.log; exit 1

      - name: ZAP baseline scan against the local build
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8788"
          cmd_options: "-I"
          allow_issue_writing: false

  deploy:
    name: Deploy to Cloudflare
    needs: [quality, secrets-scan, codeql, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare binding types
        run: pnpm cf-typegen

      - name: Build & deploy (OpenNext → Cloudflare Workers)
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
